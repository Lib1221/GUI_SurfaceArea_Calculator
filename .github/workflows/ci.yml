name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: javac
        run: |
          mkdir -p out
          javac -d out $(find . -name "*.java" -not -path "./out/*")
